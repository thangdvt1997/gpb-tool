# Nginx phục vụ bản build tĩnh của frontend (thư mục dist của Vite).
# Chỉ lắng nghe localhost. Người dùng đi qua gateway (127.0.0.1:18080), không truy cập trực tiếp.

server {
    listen 127.0.0.1:18081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Trang gốc: chuyển sang /index.html để nhận cùng header không cache.
    location = / {
        rewrite ^ /index.html last;
    }

    # index.html không cache, để lần deploy sau trỏ tới đúng tên file assets mới.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Vite đặt hash trong tên file ở assets/, nên cache một năm và không cần revalidate.
    # Asset thiếu thì trả 404 thật, không rơi về index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback: đường dẫn không phải file thật trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
