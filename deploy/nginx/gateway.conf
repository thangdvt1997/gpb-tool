# Gateway: điểm vào duy nhất của hệ thống, chỉ lắng nghe 127.0.0.1:18080.
# Truy cập từ laptop qua SSH tunnel: ssh -L 18080:127.0.0.1:18080 user@host
# Mọi upstream dùng 127.0.0.1 với port cố định vì các container chạy network_mode: host (không có DNS giữa container).
# Gateway không cắt tiền tố /api/...: service nhận đường dẫn đầy đủ (ví dụ /api/auth/me).

# Nâng cấp kết nối (WebSocket) khi client yêu cầu; còn lại dùng kết nối thường.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:18080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Đặt ở cấp server để mọi location proxy đều kế thừa (location không khai báo proxy_set_header riêng).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Kiểm tra gateway còn sống. Không gọi upstream nên không chứng minh auth/it đã sẵn sàng.
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # auth: đăng nhập SSO, phiên (cookie sid), tenant.
    location /api/auth {
        proxy_pass http://127.0.0.1:3001;
    }

    # it: trạng thái dịch vụ, ticket, sự cố, phòng họp, vinh danh.
    location /api/it {
        proxy_pass http://127.0.0.1:3002;
    }

    location /api/rooms {
        proxy_pass http://127.0.0.1:3002;
    }

    location /api/kudos {
        proxy_pass http://127.0.0.1:3002;
    }

    # games: trò chơi giải trí (3003). Không có dấu / cuối để cả /api/games và /api/games/... đều được proxy.
    # Tránh 301 của nginx làm mất method POST.
    location /api/games {
        proxy_pass http://127.0.0.1:3003;
    }

    # karaoke: karaoke (3004). Cùng quy tắc không có dấu / cuối như /api/games.
    location /api/karaoke {
        proxy_pass http://127.0.0.1:3004;
    }

    # events: sự kiện giao lưu văn nghệ (3015). Cùng quy tắc không có dấu / cuối như /api/games.
    location /api/events {
        proxy_pass http://127.0.0.1:3015;
    }

    # display: màn hình văn phòng (3016), tivi và bảng vẽ realtime qua SSE. Không có dấu / cuối như /api/games.
    # SSE cần tắt buffer và cache, giữ kết nối dài (heartbeat 25 giây, timeout đọc 3600 giây).
    # Khai báo proxy_set_header ở đây làm mất kế thừa từ cấp server, nên Host và X-Forwarded-* được khai báo lại.
    location /api/display {
        proxy_pass http://127.0.0.1:3016;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # plants: cây cảnh văn phòng (3007). Không có dấu / cuối để cả /api/plants và /api/plants/... đều được proxy.
    # Tránh 301 của nginx làm mất method POST.
    location /api/plants {
        proxy_pass http://127.0.0.1:3007;
    }

    # layout: bố trí văn phòng (3008). Không có dấu / cuối để giữ nguyên /api/layout/...
    # SSE cần tắt buffer và cache, giữ kết nối dài (heartbeat 25 giây).
    location /api/layout {
        proxy_pass http://127.0.0.1:3008;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # API không khai báo trả 404 JSON, không rơi về trang SPA.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Mọi đường dẫn còn lại là frontend.
    location / {
        proxy_pass http://127.0.0.1:18081;
    }
}
